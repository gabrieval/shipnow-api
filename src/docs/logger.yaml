paths:
  /logger-test:
    get:
      tags: [Logger]
      summary: Emite un log de cada nivel (herramienta interna)
      description: >
        **No es una funcionalidad de negocio.** Es una herramienta interna de validacion:
        existe para comprobar de un vistazo que el sistema de logs quedo bien configurado.


        Al llamarlo se emite un registro en cada uno de los seis niveles
        (`debug`, `http`, `info`, `warning`, `error`, `fatal`) y se puede verificar que:


        - En la **consola** aparecen los seis niveles en desarrollo, y solo desde `info` en produccion.

        - En `logs/error-YYYY-MM-DD.log` quedan **unicamente** `error` y `fatal`.

        - En `logs/combined-YYYY-MM-DD.log` queda todo desde `info` hacia arriba.


        No recibe parametros, no modifica datos y no toca la base.


        **Disponibilidad:** en produccion queda deshabilitado por defecto y responde 404, igual
        que el modulo de mocks. Se puede encender con `ENABLE_INTERNAL_ENDPOINTS=true`.
      responses:
        '200':
          description: Logs emitidos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        type: object
                        properties:
                          mensaje:
                            type: string
                            example: Se emitio un log de cada nivel. Revisa la consola y la carpeta de logs.
                          entorno:
                            type: string
                            enum: [development, production, test]
                            example: development
                          nivelesEmitidos:
                            type: array
                            items: { type: string }
                            example: [debug, http, info, warning, error, fatal]
                          nivelMinimoEnConsola:
                            type: string
                            description: Depende de `NODE_ENV`. `debug` en desarrollo, `info` en produccion.
                            example: debug
                          jerarquia:
                            type: object
                            description: Niveles de Winston. A menor numero, mayor severidad.
                            example:
                              fatal: 0
                              error: 1
                              warning: 2
                              info: 3
                              http: 4
                              debug: 5
                          archivos:
                            description: Donde se persisten los logs. En entorno de test no se escribe nada.
                            example:
                              carpeta: /ruta/al/proyecto/logs
                              error-YYYY-MM-DD.log: solo error y fatal
                              combined-YYYY-MM-DD.log: desde info hacia arriba
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [Logger]
      summary: Estado de la API
      description: >
        Chequeo de vida, pensado para orquestadores: Docker lo usa como `HEALTHCHECK` y un
        balanceador puede consultarlo para saber si la instancia esta sana.


        **No expone informacion sensible**: ni la URI de la base, ni variables de entorno, ni
        rutas del servidor. Solo el estado, el entorno, la version, el uptime, la marca de
        tiempo y si la conexion con MongoDB esta activa.


        A diferencia del resto de las herramientas internas, **sigue disponible en produccion**:
        apagarlo dejaria al orquestador sin forma de saber si la API responde.
      responses:
        '200':
          description: La API responde.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        type: object
                        properties:
                          status: { type: string, example: ok }
                          environment:
                            type: string
                            enum: [development, production, test]
                            example: development
                          version:
                            type: string
                            description: Version del paquete.
                            example: 1.0.0
                          uptime:
                            type: number
                            description: Segundos desde el arranque del proceso.
                            example: 42.87
                          timestamp:
                            type: string
                            format: date-time
                            example: '2026-08-23T22:28:52.091Z'
                          database:
                            type: string
                            description: Estado de la conexion con MongoDB. Nunca la URI.
                            enum: [connected, connecting, disconnecting, disconnected, unknown]
                            example: connected
        '500':
          $ref: '#/components/responses/InternalError'
